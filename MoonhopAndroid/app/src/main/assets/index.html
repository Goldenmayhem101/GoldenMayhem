<style>/* ===== Golden Mayhem kit: shared screens (intro, home, levels, daily, shop, settings, results, pause, gifts) ===== */
:root{
  --gm-bg:#101030; --gm-panel:#1c1a4a; --gm-panel-2:#14123a; --gm-edge:#3a3590; --gm-ink:#fff; --gm-muted:#a9a6d8;
  --gm-accent:#ffd23f; --gm-accent-ink:#1a1240; --gm-good:#36d48a; --gm-coin:#ffd23f; --gm-scrim:rgba(6,6,24,.82);
  --gm-font-display:system-ui,sans-serif; --gm-font-body:system-ui,sans-serif;
  --gm-safe-t:env(safe-area-inset-top,0px); --gm-safe-b:env(safe-area-inset-bottom,0px);
}
.gm-layer{position:fixed;inset:0;z-index:200;display:grid;place-items:center;padding:calc(12px + var(--gm-safe-t)) max(14px,env(safe-area-inset-right,0px)) calc(12px + var(--gm-safe-b)) max(14px,env(safe-area-inset-left,0px));font-family:var(--gm-font-body);color:var(--gm-ink);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.gm-layer[hidden]{display:none!important}
.gm-scrim{background:var(--gm-scrim)}
.gm-panel{width:min(100%,380px);max-height:100%;overflow:auto;background:var(--gm-panel);border-radius:26px;box-shadow:0 0 0 2px var(--gm-edge),0 24px 50px rgba(0,0,0,.45);padding:20px 18px;display:flex;flex-direction:column;gap:12px;text-align:center;animation:gm-in .22s ease-out;scrollbar-width:none}
.gm-panel::-webkit-scrollbar{display:none}
@keyframes gm-in{from{transform:scale(.92);opacity:0}}
.gm-panel h2{margin:0;font:400 30px/1 var(--gm-font-display);letter-spacing:.01em}
.gm-panel h3{margin:0;font:800 13px/1 var(--gm-font-body);letter-spacing:.14em;color:var(--gm-muted);text-transform:uppercase}
.gm-p{margin:0;color:var(--gm-muted);font-size:15px;line-height:1.35;font-weight:600}
.gm-btn{appearance:none;border:0;border-radius:18px;padding:14px 16px;font:400 22px/1 var(--gm-font-display);background:var(--gm-accent);color:var(--gm-accent-ink);box-shadow:inset 0 -5px 0 rgba(0,0,0,.2);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;touch-action:manipulation}
.gm-btn:active{transform:translateY(2px);box-shadow:inset 0 -2px 0 rgba(0,0,0,.2)}
.gm-btn.sec{background:var(--gm-panel-2);color:var(--gm-ink);box-shadow:inset 0 0 0 2px var(--gm-edge),inset 0 -4px 0 rgba(0,0,0,.25)}
.gm-btn.good{background:var(--gm-good);color:#062a18}
.gm-btn.ghost{background:transparent;color:var(--gm-muted);box-shadow:none;font:800 16px var(--gm-font-body);padding:6px}
.gm-btn.sm{font-size:17px;padding:11px 12px;border-radius:14px}
.gm-btn:disabled{opacity:.45}
.gm-btn:focus-visible,.gm-icon:focus-visible,.gm-tile:focus-visible{outline:3px solid var(--gm-accent);outline-offset:2px}

let ac=null,master=null,musicGain=null,sfxGain=null;
function audio(){
  if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)();master=ac.createGain();master.connect(ac.destination);
    musicGain=ac.createGain();musicGain.gain.value=S.set.music?1:0;musicGain.connect(master);sfxGain=ac.createGain();sfxGain.connect(master)}catch(e){}}
  if(ac&&ac.state==='suspended'&&!document.hidden)ac.resume().catch(()=>{});
  return ac;
}
function tone(f1,f2,d,type='sine',v=.07,delay=0){
  if(!S.set.sound||!audio())return;
  try{const t=ac.currentTime+delay,o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f1,t);if(f2&&f2!==f1)o.frequency.exponentialRampToValueAtTime(f2,t+d);
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(sfxGain);o.start(t);o.stop(t+d+.02)}catch(e){}
}
function vibrate(ms){if(!S.set.vibe)return;if(window.GMApp&&GMApp.vibrate){GMApp.vibrate(ms);return}try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}}
const ui={tap:()=>tone(520,620,.06,'triangle',.05),coin:()=>{tone(1100,1500,.09,'sine',.05);tone(1500,1900,.1,'sine',.04,.07)},
  win:()=>[523,659,784,1046].forEach((f,i)=>tone(f,f,.22,'triangle',.06,i*.1)),buy:()=>{tone(700,900,.08,'square',.03);tone(900,1300,.12,'triangle',.05,.06)},
  no:()=>tone(220,160,.18,'sawtooth',.04),open:()=>[392,523,659,784,1046,1318].forEach((f,i)=>tone(f,f*1.01,.18,'triangle',.05,i*.06))};
/* music: soft generative arpeggio over a 4-chord loop */
let mus={on:false,timer:0,step:0,next:0};
function musicStart(){if(!audio()||mus.on)return;mus.on=true;mus.next=ac.currentTime+.1;mus.step=0;musTick()}
function musTick(){
  if(!mus.on)return;const M=C.music||{};const prog=M.prog||[[0,4,7],[-3,0,4],[-7,-3,0],[-5,-1,2]];const root=M.root||220,bpm=M.bpm||92,spb=60/bpm/2;
  while(mus.next<ac.currentTime+.4){
    const bar=Math.floor(mus.step/8)%prog.length,ch=prog[bar],i=mus.step%8,t=mus.next;
    const pat=M.pattern||[0,1,2,1,0,2,1,2];const semi=ch[pat[i]%ch.length]+(i===5?12:0);const f=root*Math.pow(2,semi/12);
    note(f,t,spb*1.8,M.wave||'triangle',.022);
    if(i===0)note(root/2*Math.pow(2,ch[0]/12),t,spb*7,'sine',.035);
    mus.step++;mus.next+=spb;
  }
  mus.timer=setTimeout(musTick,120);
}
function note(f,t,d,type,v){try{const o=ac.createOscillator(),g=ac.createGain(),lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=1800;o.type=type;o.frequency.value=f;
  g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(v,t+.04);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(lp).connect(g).connect(musicGain);o.start(t);o.stop(t+d+.05)}catch(e){}}
function musicStop(){mus.on=false;clearTimeout(mus.timer)}
function applyMusic(){if(!ac)return;musicGain.gain.setTargetAtTime(S.set.music?1:0,ac.currentTime,.1);if(S.set.music)musicStart()}
document.addEventListener('visibilitychange',()=>{if(!ac)return;if(document.hidden){musicStop();ac.suspend().catch(()=>{})}else{ac.resume().catch(()=>{});if(S.set.music)musicStart()}});

function sheet(id,title,body,opts={}){

  const close=()=>{L.remove();const i=stack.indexOf(entry);if(i>=0)stack.splice(i,1);opts.onClose&&opts.onClose()};
  const entry={L,close,back:opts.back||close};stack.push(entry);

function intro(done){
  const first=!S.intro;S.intro=(S.intro||0)+1;save();
  const L=h('div','gm-layer');L.id='gm-intro';L.innerHTML='<canvas></canvas><div class="gm-skip">TAP TO SKIP</div>';document.body.appendChild(L);
  const cv=$('canvas',L),g=cv.getContext('2d');let W,H,dpr;
  function rs(){dpr=Math.min(2,devicePixelRatio||1);W=L.clientWidth;H=L.clientHeight;cv.width=W*dpr;cv.height=H*dpr;g.setTransform(dpr,0,0,dpr,0,0)}rs();addEventListener('resize',rs);
  const studio=first?2.1:0,logo=first?2.3:1.25,total=studio+logo;let t0=performance.now(),end=false;
  function finish(){if(end)return;end=true;removeEventListener('resize',rs);L.style.transition='opacity .35s';L.style.opacity='0';setTimeout(()=>{L.remove();done()},350)}
  L.addEventListener('pointerdown',finish);
  (function fr(now){if(end)return;const t=Math.max(0,(now-t0)/1000);
    g.fillStyle='#07060f';g.fillRect(0,0,W,H);
    if(studio>0&&t<studio){drawStudio(g,W,H,t/studio)}
    else{const p=Math.min(1,(t-studio)/logo);g.save();C.intro.draw(g,W,H,p,t-studio);g.restore();
      const fade=p<.12?1-p/.12:0;if(first&&fade>0){g.fillStyle=`rgba(7,6,15,${fade})`;g.fillRect(0,0,W,H)}}
    if(t>=total){finish();return}requestAnimationFrame(fr)})(t0);
}
function drawStudio(g,W,H,p){
  const a=p<.22?p/.22:p>.8?Math.max(0,1-(p-.8)/.2):1;const cx=W/2,cy=H/2;
  g.globalAlpha=a;
  const rg=g.createRadialGradient(cx,cy,10,cx,cy,Math.max(W,H)*.6);rg.addColorStop(0,'rgba(255,200,60,.16)');rg.addColorStop(1,'rgba(255,200,60,0)');g.fillStyle=rg;g.fillRect(0,0,W,H);
  g.textAlign='center';g.textBaseline='middle';

  g.save();g.translate(cx,cy-fs*1.75);g.scale(fs/52,fs/52);g.fillStyle='#ffc62e';g.beginPath();g.moveTo(-26,10);g.lineTo(-30,-12);g.lineTo(-12,0);g.lineTo(0,-18);g.lineTo(12,0);g.lineTo(30,-12);g.lineTo(26,10);g.closePath();g.fill();g.restore();
  g.fillStyle='rgba(255,255,255,.7)';g.font='800 '+Math.round(Math.min(W*.04,16))+'px '+bodyFont();g.fillText('A GAME BY',cx,cy-fs*.85);

  o.textAlign='center';o.textBaseline='middle';o.font='400 '+Math.round(fs)+'px '+dispFont();
  const gr=o.createLinearGradient(0,th/2-fs/2,0,th/2+fs/2);gr.addColorStop(0,'#fff3b0');gr.addColorStop(.5,'#ffc62e');gr.addColorStop(1,'#e88a12');

  g.drawImage(oc,0,cy+4-th/2,tw,th);

function setStars(i,st){const old=S.stars[i]||0;if(st>old){S.stars[i]=st;save()}return Math.max(0,st-old)}

/* ---------- daily challenge ---------- */
function yesterdayKey(){const d=new Date();d.setDate(d.getDate()-1);return dayKey(d)}
function streakNow(){const l=S.daily.last;return(l===dayKey()||l===yesterdayKey())?S.daily.streak:0}
function dailySeed(){return hashStr(C.id+'|'+dayKey())}
function openDaily(){
  const now=new Date(),y=now.getFullYear(),m=now.getMonth(),first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate(),today=now.getDate();
  let cal='<div class="gm-cal">'+['S','M','T','W','T','F','S'].map(d=>`<div class="wd">${d}</div>`).join('');
  for(let i=0;i<first;i++)cal+='<div class="d e"></div>';
  for(let d=1;d<=days;d++){const k=dayKey(new Date(y,m,d));cal+=`<div class="d${S.daily.done[k]?' done':''}${d===today?' today':''}${d>today?' fut':''}">${S.daily.done[k]?'★':d}</div>`}
  cal+='</div>';
  const done=!!S.daily.done[dayKey()],st=streakNow(),rew=dailyReward(done?st:st+1);
  const mid=new Date(y,m,today+1)-now;
  const body=`<h3>${now.toLocaleString('en',{month:'long'})} ${y}</h3>${cal}
   <div class="gm-streak">${I.flame}<span>${st} day streak</span></div>
   <div class="gm-goal">${C.daily.goal}<br>Reward: ${coinTxt(rew)} ${done?'':'<span style="color:var(--gm-muted)">(grows with your streak)</span>'}</div>
   ${done?`<button class="gm-btn sec" disabled>Done ✓ New challenge in <span id="gm-dyt">${fmtTime(mid)}</span></button>`:`<button class="gm-btn" id="gm-dyplay">${I.play.replace('<svg','<svg width="22" height="22"')} Play today's challenge</button>`}`;
  const s=sheet('gm-dailyL','Daily Challenge',body);
  const pb=$('#gm-dyplay',s.L);if(pb)pb.onclick=()=>{ui.tap();startGame(()=>C.daily.play(dailySeed(),dayKey()))};
}
function dailyReward(streak){return 40+10*Math.min(Math.max(streak,1)-1,6)}
/** call when the player beats today's challenge; returns the coin reward (0 if already done today) */
function dailyComplete(key){
  key=key||dayKey();if(S.daily.done[key])return 0;
  S.daily.done[key]=true;S.daily.streak=(S.daily.last===yesterdayKey()?S.daily.streak:0)+1;S.daily.last=key;
  // keep the stored calendar small (about 3 months)
  const keys=Object.keys(S.daily.done).sort();while(keys.length>100)delete S.daily.done[keys.shift()];
  save();return dailyReward(S.daily.streak);
}

/* opts: {win, title, label, score, best, newBest, stars(0-3|null), coins, extra:{label,amount}, canRevive, reviveLabel, onRevive, onRetry, onNext, onHome} */
function results(o){
  S.runs++;if(S.chest<3)S.chest++;
  if(o.win||o.newBest){S.rate.wins++;if(!S.rate.done&&S.rate.wins>=3&&S.runs>=5&&Date.now()-S.rate.last>3*864e5)S.rate.pending=true}
  let earned=(o.coins||0)+((o.extra&&o.extra.amount)||0);S.coins+=earned;save();
  const starsHtml=o.stars==null?'':`<div class="gm-stars">${I.star}${I.star}${I.star}</div>`;
  const s=sheet('gm-resL',esc(o.title),`${starsHtml}
    ${o.label?`<h3>${esc(o.label)}</h3>`:''}<div class="gm-big">${o.score}</div>${o.newBest?'<span class="gm-newbest">NEW BEST!</span>':(o.best!=null?`<p class="gm-p">Best ${o.best}</p>`:'')}

    ${o.extra?`<p class="gm-p" style="font-size:13px">${esc(o.extra.label)} ${coinTxt(o.extra.amount)} included</p>`:''}
    ${o.canRevive?`<button class="gm-btn good" id="gm-rv">${I.film.replace('<svg','<svg width="22" height="22"')} ${esc(o.reviveLabel||'Keep going')} <span class="gm-ad">AD</span></button>`:''}
    ${earned>0?`<button class="gm-btn sec sm" id="gm-dbl">${I.film.replace('<svg','<svg width="18" height="18"')} Double to ${CUR().icon} ${earned*2} <span class="gm-ad">AD</span></button>`:''}
    ${o.onNext?`<button class="gm-btn" id="gm-nx">Next level ${I.play.replace('<svg','<svg width="20" height="20"')}</button>`:''}
    <div class="gm-row"><button class="gm-btn sec" id="gm-hm" aria-label="Home">${I.home.replace('<svg','<svg width="22" height="22"')}</button><button class="gm-btn ${o.onNext?'sec':''}" id="gm-rt" style="flex:3">${I.retry.replace('<svg','<svg width="20" height="20"')} ${o.retryLabel||'Try again'}</button></div>`,{noClose:true,back:()=>{s.close();maybeInterstitial(()=>{(o.onHome||showHome)()})}});
  if(o.stars!=null){if(o.stars>0)ui.win();setTimeout(()=>s.L.querySelectorAll('.gm-stars svg').forEach((e,i)=>{if(i<o.stars)setTimeout(()=>{e.classList.add('on');tone(700+i*200,900+i*200,.15,'triangle',.06)},i*260)}),250)}

  const nx=$('#gm-nx',s.L);if(nx)nx.onclick=()=>{ui.tap();go(()=>{mode='game';o.onNext()})};
  $('#gm-rt',s.L).onclick=()=>{ui.tap();go(()=>{mode='game';o.onRetry()})};
  $('#gm-hm',s.L).onclick=()=>{ui.tap();go(()=>(o.onHome||showHome)())};
}

const HAND_SVG='<svg class="hand" viewBox="0 0 58 70"><path d="M22 4c3.6 0 6 2.4 6 6v20l2-.6c3-.8 5.6.6 6.4 3l.2.6 1.6-.4c3-.6 5.4 1 6 3.4l1.6-.2c3.2-.2 5.6 1.8 5.8 5l.4 10c.2 8-4.2 14.6-11.6 17.2-3 1-6 1.4-9.2 1.4h-3.6c-5.8 0-10.6-3-13.4-8L4.4 46.6c-1.4-2.8-.4-6 2.4-7.2 2.4-1 5-.2 6.4 1.8l2.8 4V10c0-3.6 2.4-6 6-6z" fill="#fff" stroke="#1a1240" stroke-width="3" stroke-linejoin="round"/><path d="M28 30v10M36.6 32.8V41M44 36.6V42" stroke="#1a1240" stroke-width="2.6" stroke-linecap="round"/></svg>';
let handEl=null,handAnim=null;
function hand(o){
  if(!handEl){handEl=h('div');handEl.id='gm-hand';document.body.appendChild(handEl)}
  handEl.hidden=false;if(handAnim){handAnim.cancel();handAnim=null}
  let html='';
  if(o.mode==='drag'||o.line){html+=`<svg class="line"><path d="M${o.x} ${o.y} L${o.x2} ${o.y2}"/></svg>`}
  if(o.mode==='tap')html+=`<div class="ring" style="left:${o.x}px;top:${o.y}px"></div>`;
  if(o.x!=null)html+=HAND_SVG;
  if(o.text){const below=o.tipAt==='bottom'||(o.tipAt!=='top'&&(o.y||0)<innerHeight*.45);html+=`<div class="tip" style="${below?'bottom:calc(24px + var(--gm-safe-b))':'top:calc(70px + var(--gm-safe-t))'}">${o.text}</div>`}
  handEl.innerHTML=html;
  const hd=$('.hand',handEl);if(!hd)return;
  if(o.mode==='drag'){hd.style.transform=`translate(${o.x}px,${o.y}px)`;handAnim=hd.animate([{transform:`translate(${o.x}px,${o.y}px)`,offset:0},{transform:`translate(${o.x}px,${o.y}px) scale(.9)`,offset:.15},{transform:`translate(${o.x2}px,${o.y2}px) scale(.9)`,offset:.75},{transform:`translate(${o.x2}px,${o.y2}px)`,offset:.85,opacity:1},{transform:`translate(${o.x2}px,${o.y2}px)`,offset:1,opacity:0}],{duration:1700,iterations:Infinity,easing:'ease-in-out'})}
  else{hd.style.setProperty('--hx',o.x+'px');hd.style.setProperty('--hy',o.y+'px');hd.classList.add('tap')}
}
function handHide(){if(handEl)handEl.hidden=true;if(handAnim){handAnim.cancel();handAnim=null}}

function dailyCfg(seed,key){return{mode:'daily',goal:25,base:16,seed,key}}

/* ---------- seeded random so every level and Daily Challenge is the same for everyone ---------- */
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let rng=Math.random;
const R=(a,b)=>a+rng()*(b-a);

const stars=[0.15,0.35,0.6].map((f,li)=>({f,pts:Array.from({length:55},()=>({x:Math.random(),y:Math.random(),s:Math.random()*1.3+.4+li*.3,tw:Math.random()*6}))}));
let state='attract',cfg={mode:'endless',base:0},planets=[],rocks=[],dusts=[],parts=[],trail=[],moon=null,camY=0,score=0,runDust=0,totalDust=0,made=0,t=0,revived=false,flash=0;
let boosts={},shieldUsed=false,tutHops=0,tutMsg='';
const diff=()=>cfg.base+score;

function makePlanet(x,y,first){
  const d=diff();const r=first?26:R(17,29);let type='normal';
  if(!first&&!cfg.tut){const q=rng();if(d>=5&&q<Math.min(.4,.18+d*.01))type='decay';else if(d>=3&&rng()<.3)type='fast'}
  return{x,y,r,ring:r+46,col:PAL[Math.floor(rng()*PAL.length)],type,ringed:rng()<.35,tilt:R(-.5,.5),life:type==='decay'?3.4:0,alive:true,visited:first,spin:R(0,6)};
}
function makeHaven(x,y){return{x,y,r:30,ring:30+50,col:['#fff3b0','#e8a417'],type:'haven',ringed:true,tilt:-.25,life:0,alive:true,visited:false,spin:0}}
function spawnAhead(){
  while(planets[planets.length-1].y>camY-H*1.2){
    if(cfg.goal&&made>=cfg.goal)break;
    const p=planets[planets.length-1];
    const gap=Math.min(H*.36,175+Math.min(70,diff()*2.5))*R(.92,1.15);
    const ny=p.y-gap;let nx=p.x+R(-.42,.42)*W;
    if(Math.abs(nx-p.x)<40)nx+=nx<W/2?60:-60;
    nx=Math.max(56,Math.min(W-56,nx));
    made++;const np=(cfg.goal&&made===cfg.goal)?makeHaven(nx,ny):makePlanet(nx,ny,false);planets.push(np);
    const n=cfg.tut?2:(rng()<.7?(1+Math.floor(rng()*3)):0);
    for(let i=0;i<n;i++){const k=(i+1)/(n+1);dusts.push({x:p.x+(nx-p.x)*k+(cfg.tut?0:R(-40,40)),y:p.y+(ny-p.y)*k+(cfg.tut?0:R(-20,20)),got:false,ph:R(0,6)});totalDust++}
    if(!cfg.tut&&diff()>=8&&rng()<.35){rocks.push({cx:W/2,y:(p.y+ny)/2+R(-15,15),amp:W*R(.25,.42),sp:R(.7,1.3)*(rng()<.5?-1:1),ph:R(0,6),r:R(9,13),x:0})}
  }
  const cut=camY+H*2;
  planets=planets.filter(p=>p.y<cut||p===moon.p||p===moon.last);dusts=dusts.filter(d=>d.y<cut);rocks=rocks.filter(r=>r.y<cut);
}
function setup(c){
  cfg=c;rng=c.seed!=null?mulberry(c.seed):Math.random;
  score=0;runDust=0;totalDust=0;made=0;revived=false;shieldUsed=false;parts=[];trail=[];dusts=[];rocks=[];tutHops=0;
  const p0=makePlanet(W/2,H*.68,true);planets=[p0];
  moon={mode:'orbit',p:p0,ang:-Math.PI/2,rad:p0.r+24,dir:1,x:0,y:0,vx:0,vy:0,ft:0,last:p0};
  camY=p0.y-H*.66;spawnAhead();updHud();
}
function omega(p){let w=2.3+Math.min(1.6,diff()*.05);if(p.type==='fast')w*=1.55;if(p.type==='haven')w=1.4;if(boosts.steady)w*=.82;if(cfg.tut)w*=.62;return w}
function updHud(){
  $('#sc').textContent=score;$('#du').textContent=runDust;
  $('#scOf').textContent=cfg.goal?' / '+cfg.goal:'';
  $('#hudLabel').textContent=cfg.tut?'TUTORIAL':cfg.mode==='level'?'LEVEL '+(cfg.level+1):cfg.mode==='daily'?'DAILY':'WORLDS';
  $('#boostIcons').textContent=(boosts.shield&&!shieldUsed?'🛡️':'')+(boosts.magnet?'🧲':'')+(boosts.steady?'🌙':'');
}
function burst(x,y,col,n=14,sp=160){for(let i=0;i<n;i++){const a=Math.random()*6.283,s=(.3+Math.random()*.7)*sp;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.4+Math.random()*.4,max:.8,col})}}

/* ---------- run flow ---------- */
function startRun(c){
  setup(c);
  boosts={};if(!c.tut)GM.takeBoosters().forEach(id=>boosts[id]=true);
  updHud();$('#hud').hidden=false;state='play';
  if(boosts.shield||boosts.magnet||boosts.steady)GM.toast('Boosters on: '+$('#boostIcons').textContent);
}
function toAttract(){
  GM.handHide();$('#hud').hidden=true;state='attract';
  setup({mode:'endless',base:0,seed:null});
}
function launch(){
  if(state!=='play'||moon.mode!=='orbit')return;
  const sp=560,a=moon.ang;
  moon.vx=-Math.sin(a)*moon.dir*sp;moon.vy=Math.cos(a)*moon.dir*sp;
  moon.mode='fly';moon.ft=0;moon.last=moon.p;moon.p=null;
  GM.tone(300,700,.15,'triangle');
}
function respawn(){
  let p=moon.p&&moon.p.alive?moon.p:moon.last;if(!p||!p.alive)p=planets.filter(q=>q.alive&&q.visited).pop()||planets.find(q=>q.alive);
  p.alive=true;if(p.type==='decay')p.life=3.4;
  moon.mode='orbit';moon.p=p;moon.last=p;moon.rad=p.r+24;moon.ang=-Math.PI/2;trail=[];rocks=rocks.filter(r=>Math.abs(r.y-p.y)>70);
}
function die(msg){
  if(state!=='play')return;
  if(cfg.tut){burst(moon.x,moon.y,'#ffffff',14,140);respawn();GM.toast('Try again: tap when the line points at the world');return}
  if(boosts.shield&&!shieldUsed){shieldUsed=true;burst(moon.x,moon.y,'#6fd3ff',22,180);GM.tone(900,300,.3,'triangle',.06);GM.vibrate(40);respawn();updHud();GM.toast('🛡️ Shield saved you!');return}
  state='dead';burst(moon.x,moon.y,'#ffffff',26,220);GM.tone(400,60,.6,'sawtooth',.06);GM.vibrate(80);
  setTimeout(()=>showFail(msg),750);
}
function showFail(msg){
  const base={title:msg,coins:runDust,canRevive:!revived,reviveLabel:'Keep going',onRevive:revive,onHome:goHome};
  if(cfg.mode==='endless'){const nb=GM.best('endless',score);GM.results({...base,label:'Worlds reached',score,newBest:nb&&score>0,best:GM.best('endless'),onRetry:()=>startRun(cfg)})}
  else if(cfg.mode==='level')GM.results({...base,label:'Level '+(cfg.level+1)+' · reach '+cfg.goal+' worlds',score:score+'/'+cfg.goal,retryLabel:'Retry level',onRetry:()=>startRun(levelCfg(cfg.level))});
  else GM.results({...base,label:'Daily Challenge',score:score+'/'+cfg.goal,retryLabel:'Retry',onRetry:()=>startRun(dailyCfg(cfg.seed,cfg.key))});
}
function revive(){revived=true;state='play';respawn();$('#hud').hidden=false;updHud()}
function win(){
  state='win';flash=.6;GM.vibrate(60);
  const h=planets[planets.length-1];for(let i=0;i<4;i++)setTimeout(()=>burst(h.x,h.y,PAL[i][0],24,260),i*140);
  setTimeout(()=>{
    if(cfg.tut){GM.tutorialDone();GM.handHide();GM.results({title:"You're ready!",label:'Tutorial complete',score:'★',coins:runDust+20,stars:null,retryLabel:'Play Level 1',onRetry:()=>startRun(levelCfg(0)),onHome:goHome});return}
    if(cfg.mode==='level'){
      const pct=totalDust?runDust/totalDust:1,st=1+(pct>=.5?1:0)+(pct>=.85?1:0);const newSt=GM.setStars(cfg.level,st);
      GM.results({win:true,title:'Level '+(cfg.level+1)+' complete!',label:'Stardust collected',score:runDust+'/'+totalDust,stars:st,coins:runDust,
        extra:newSt?{label:'New star bonus',amount:newSt*10}:null,retryLabel:'Replay',onRetry:()=>startRun(levelCfg(cfg.level)),
        onNext:cfg.level<LEVELS-1?()=>startRun(levelCfg(cfg.level+1)):null,onHome:goHome});
    }else{
      const rew=GM.dailyComplete(cfg.key);
      GM.results({win:true,title:'Daily Challenge done!',label:'Worlds',score:score+'/'+cfg.goal,coins:runDust,extra:rew?{label:'Daily reward',amount:rew}:null,retryLabel:'Play again',onRetry:()=>startRun(dailyCfg(cfg.seed,cfg.key)),onHome:goHome});
    }
  },1100);
}
function goHome(){toAttract();GM.showHome()}
function openPause(){if(state!=='play')return;state='paused';GM.handHide();
  GM.pause({onResume:()=>{state='play'},onRestart:()=>startRun(cfg.mode==='level'?levelCfg(cfg.level):cfg.mode==='daily'?dailyCfg(cfg.seed,cfg.key):{mode:'endless',base:0,seed:null}),onHome:goHome})}

/* ---------- simulation ---------- */
function nextTarget(){const from=moon.p||moon.last;let best=null;for(const p of planets){if(p.alive&&!p.visited&&p.y<from.y&&(!best||p.y>best.y))best=p}return best}
function aimedAt(p){if(!p||moon.mode!=='orbit')return false;const a=moon.ang,vx=-Math.sin(a)*moon.dir,vy=Math.cos(a)*moon.dir;const dx=p.x-moon.x,dy=p.y-moon.y,d=Math.hypot(dx,dy);
  const cos=(vx*dx+vy*dy)/d;if(cos<=0)return false;const ang=Math.acos(Math.min(1,cos));return ang<Math.asin(Math.min(1,(p.ring-8)/d))&&d/560<1.8}
function step(dt){
  t+=dt;
  if(state==='play'||state==='attract'){
    if(moon.mode==='orbit'){
      const p=moon.p;moon.ang+=moon.dir*omega(p)*dt;
      if(moon.rad>p.r+22)moon.rad-=dt*30;
      moon.x=p.x+Math.cos(moon.ang)*moon.rad;moon.y=p.y+Math.sin(moon.ang)*moon.rad;
      if(p.type==='decay'&&state==='play'){p.life-=dt;if(p.life<=0){p.alive=false;burst(p.x,p.y,p.col[0],30,240);die('Your world collapsed')}}
    }else if(moon.mode==='fly'){
      moon.x+=moon.vx*dt;moon.y+=moon.vy*dt;moon.ft+=dt;
      for(const p of planets){
        if(p===moon.last||!p.alive)continue;
        const dx=moon.x-p.x,dy=moon.y-p.y,d=Math.hypot(dx,dy);
        if(d<p.ring){
          moon.mode='orbit';moon.p=p;moon.ang=Math.atan2(dy,dx);moon.rad=Math.max(p.r+14,Math.min(p.ring-4,d));
          moon.dir=(dx*moon.vy-dy*moon.vx)>=0?1:-1;
          if(!p.visited){p.visited=true;score++;flash=.3;burst(p.x,p.y,p.col[0],16,140);GM.tone(500,900,.18,'sine',.08);GM.vibrate(12);
            if(cfg.tut){tutHops++}
            if(p.type==='haven'){updHud();win();return}}
          updHud();break;
        }
      }
      if(moon.mode==='fly'&&(moon.x<-30||moon.x>W+30||moon.y>camY+H+40||moon.ft>1.9))die('Lost in space');
    }
    if(state==='play'){
      for(const r of rocks){r.x=r.cx+Math.sin(t*r.sp+r.ph)*r.amp;if(Math.hypot(r.x-moon.x,r.y-moon.y)<r.r+7)die('Hit by a meteor')}
      for(const d of dusts){if(d.got)continue;
        if(boosts.magnet){const dx=moon.x-d.x,dy=moon.y-d.y,dd=Math.hypot(dx,dy);if(dd<95&&dd>1){d.x+=dx/dd*dt*260;d.y+=dy/dd*dt*260}}
        if(Math.hypot(d.x-moon.x,d.y-moon.y)<20){d.got=true;runDust++;burst(d.x,d.y,'#ffe08a',8,90);GM.tone(1200,1600,.08,'sine',.05);updHud()}}
    }else for(const r of rocks)r.x=r.cx+Math.sin(t*r.sp+r.ph)*r.amp;
    if(moon.mode==='orbit'){const target=moon.p.y-H*.66;camY+=(target-camY)*Math.min(1,dt*3.5)}
    if(moon.p||moon.last)spawnAhead();
    trail.push({x:moon.x,y:moon.y});if(trail.length>22)trail.shift();
    if(state==='play'&&cfg.tut)tutorialTick();
  }else{for(const r of rocks)r.x=r.cx+Math.sin(t*r.sp+r.ph)*r.amp}
  parts.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.96;p.vy*=.96;p.life-=dt});parts=parts.filter(p=>p.life>0);
  flash=Math.max(0,flash-dt);
}
function tutorialTick(){
  let msg;
  if(moon.mode!=='orbit')msg='fly';
  else{const tg=nextTarget();const ok=aimedAt(tg);
    msg=ok?'tap':'wait';}
  const key=msg+tutHops;if(key===tutMsg)return;tutMsg=key;
  if(msg==='fly'){GM.handHide();return}
  const lines=[
    'Your moon is orbiting this world. Wait until the <b>dotted line</b> points at the next world…',
    'Nice hop! Fly through <b>✦ stardust</b> on the way to collect it.',
    'One more! The <b>golden Haven</b> world ends the level.',
    'Hop to the Haven!'];
  const base=lines[Math.min(tutHops,lines.length-1)];
  if(msg==='tap')GM.hand({x:W/2,y:H*.78,mode:'tap',text:'<b>TAP now!</b>',tipAt:'top'});
  else GM.hand({text:base,tipAt:'top'});
}

/* ---------- drawing ---------- */
function drawPlanet(p){
  if(!p.alive)return;
  const here=moon&&moon.p===p;
  ctx.save();
  ctx.setLineDash([3,7]);ctx.lineWidth=1.5;
  ctx.strokeStyle=here?'rgba(255,255,255,.35)':(p.type==='decay'?'rgba(255,122,89,.55)':p.type==='haven'?'rgba(255,224,138,.7)':'rgba(255,255,255,.16)');
  ctx.beginPath();ctx.arc(p.x,p.y,p.ring,0,6.283);ctx.stroke();ctx.setLineDash([]);
  if(p.type==='decay'&&here){ctx.strokeStyle='#ff7a59';ctx.lineWidth=4;ctx.beginPath();ctx.arc(p.x,p.y,p.r+9,-Math.PI/2,-Math.PI/2+6.283*(p.life/3.4));ctx.stroke()}
  const gr=p.type==='haven'?p.r*(3+Math.sin(t*3)*.3):p.r*2.2;
  const glow=ctx.createRadialGradient(p.x,p.y,p.r*.5,p.x,p.y,gr);glow.addColorStop(0,p.col[0]+(p.type==='haven'?'88':'55'));glow.addColorStop(1,p.col[0]+'00');
  ctx.fillStyle=glow;ctx.beginPath();ctx.arc(p.x,p.y,gr,0,6.283);ctx.fill();
  if(p.ringed){ctx.strokeStyle=p.col[0]+'aa';ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(p.x,p.y,p.r*1.7,p.r*.45,p.tilt,Math.PI,6.283);ctx.stroke()}
  const g=ctx.createRadialGradient(p.x-p.r*.4,p.y-p.r*.45,p.r*.1,p.x,p.y,p.r);g.addColorStop(0,p.col[0]);g.addColorStop(1,p.col[1]);
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.283);ctx.fill();
  ctx.save();ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.283);ctx.clip();ctx.fillStyle='rgba(0,0,0,.12)';
  for(let i=0;i<3;i++){const a=p.spin+t*(p.type==='fast'?1.2:.4)+i*2.1;ctx.beginPath();ctx.ellipse(p.x+Math.cos(a)*p.r*.55,p.y+Math.sin(i*1.7)*p.r*.4,p.r*.22,p.r*.14,0,0,6.283);ctx.fill()}
  if(p.type==='decay'){ctx.strokeStyle='rgba(40,0,0,.45)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(p.x-p.r*.6,p.y-p.r*.2);ctx.lineTo(p.x-p.r*.1,p.y+p.r*.1);ctx.lineTo(p.x+p.r*.2,p.y-p.r*.3);ctx.lineTo(p.x+p.r*.7,p.y+p.r*.2);ctx.stroke()}
  ctx.restore();
  if(p.ringed){ctx.strokeStyle=p.col[0]+'dd';ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(p.x,p.y,p.r*1.7,p.r*.45,p.tilt,0,Math.PI);ctx.stroke()}
  ctx.textAlign='center';
  if(p.type==='fast'){ctx.fillStyle='rgba(255,255,255,.7)';ctx.font='700 11px "Baloo 2",sans-serif';ctx.fillText('FAST',p.x,p.y+p.r+16)}
  if(p.type==='haven'){ctx.fillStyle='#ffe08a';ctx.font='800 12px "Baloo 2",sans-serif';ctx.fillText('★ HAVEN ★',p.x,p.y+p.r+20);
    ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(p.x,p.y-p.r);ctx.lineTo(p.x,p.y-p.r-22);ctx.stroke();ctx.fillStyle='#ff7a59';ctx.beginPath();ctx.moveTo(p.x,p.y-p.r-22);ctx.lineTo(p.x+15+Math.sin(t*6)*2,p.y-p.r-17);ctx.lineTo(p.x,p.y-p.r-12);ctx.fill()}
  ctx.restore();
}
function moonGrad(x,y,sk){const mg=ctx.createRadialGradient(x-2,y-3,1,x,y,8);
  if(sk.rainbow){mg.addColorStop(0,sk.c[0]);mg.addColorStop(.5,'hsl('+((t*120)%360)+',100%,65%)');mg.addColorStop(1,sk.c[1])}else{mg.addColorStop(0,sk.c[0]);mg.addColorStop(1,sk.c[1])}return mg}
function skin(){return SKINS.find(s=>s.id===GM.equipped())||SKINS[0]}
function draw(){
  ctx.fillStyle=bgGrad;ctx.fillRect(0,0,W,H);
  for(const L of stars){for(const s of L.pts){const y=(((s.y*H-camY*L.f)%H)+H)%H;ctx.globalAlpha=.35+.35*Math.sin(t*1.5+s.tw);ctx.fillStyle='#ffffff';ctx.fillRect(s.x*W,y,s.s,s.s)}}
  ctx.globalAlpha=1;
  if(!moon)return;
  ctx.save();ctx.translate(0,-camY);
  if(state==='attract')ctx.globalAlpha=.45;
  planets.forEach(drawPlanet);ctx.globalAlpha=1;
  for(const d of dusts){if(d.got)continue;const s=4+Math.sin(t*4+d.ph)*1.2;ctx.fillStyle='#ffe08a';ctx.beginPath();ctx.moveTo(d.x,d.y-s*1.6);ctx.lineTo(d.x+s*.5,d.y-s*.5);ctx.lineTo(d.x+s*1.6,d.y);ctx.lineTo(d.x+s*.5,d.y+s*.5);ctx.lineTo(d.x,d.y+s*1.6);ctx.lineTo(d.x-s*.5,d.y+s*.5);ctx.lineTo(d.x-s*1.6,d.y);ctx.lineTo(d.x-s*.5,d.y-s*.5);ctx.closePath();ctx.fill()}
  for(const r of rocks){const g=ctx.createRadialGradient(r.x-3,r.y-3,1,r.x,r.y,r.r);g.addColorStop(0,'#c9b8a8');g.addColorStop(1,'#5a4a44');ctx.fillStyle=g;ctx.beginPath();ctx.arc(r.x,r.y,r.r,0,6.283);ctx.fill();ctx.fillStyle='rgba(255,122,89,.25)';ctx.beginPath();ctx.arc(r.x,r.y,r.r+5,0,6.283);ctx.fill()}
  // tutorial guide line to the next world
  if(state==='play'&&cfg.tut&&moon.mode==='orbit'){const tg=nextTarget();if(tg){ctx.save();ctx.setLineDash([2,10]);ctx.lineCap='round';ctx.lineWidth=3;ctx.lineDashOffset=-t*30;ctx.strokeStyle=aimedAt(tg)?'#6fe8b0':'rgba(255,224,138,.6)';ctx.beginPath();ctx.moveTo(moon.x,moon.y);ctx.lineTo(tg.x,tg.y);ctx.stroke();ctx.restore()}}
  if(state!=='dead'){
    const sk=skin();
    for(let i=0;i<trail.length;i++){const p=trail[i],k=i/trail.length;ctx.globalAlpha=k*.5;ctx.fillStyle=sk.c[1];ctx.beginPath();ctx.arc(p.x,p.y,7*k,0,6.283);ctx.fill()}
    ctx.globalAlpha=1;
    if(moon.mode==='orbit'&&state!=='attract'){const a=moon.ang,tx=-Math.sin(a)*moon.dir,ty=Math.cos(a)*moon.dir;ctx.fillStyle='rgba(255,255,255,.6)';for(let i=1;i<=7;i++){ctx.beginPath();ctx.arc(moon.x+tx*i*12,moon.y+ty*i*12,2.3-i*.2,0,6.283);ctx.fill()}}
    if(boosts.shield&&!shieldUsed&&state==='play'){ctx.strokeStyle='rgba(111,211,255,'+(.45+Math.sin(t*5)*.2)+')';ctx.lineWidth=2;ctx.beginPath();ctx.arc(moon.x,moon.y,13,0,6.283);ctx.stroke()}
    ctx.shadowColor=sk.c[1];ctx.shadowBlur=16;ctx.fillStyle=moonGrad(moon.x,moon.y,sk);ctx.beginPath();ctx.arc(moon.x,moon.y,8,0,6.283);ctx.fill();ctx.shadowBlur=0;
  }
  for(const p of parts){ctx.globalAlpha=Math.max(0,p.life/p.max);ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(p.x,p.y,2.5,0,6.283);ctx.fill()}
  ctx.globalAlpha=1;ctx.restore();
  if(flash>0){ctx.fillStyle='rgba(255,255,255,'+(flash*.18)+')';ctx.fillRect(0,0,W,H)}
}
let last=performance.now();
function loop(now){const dt=Math.min(.033,(now-last)/1000);last=now;if(W&&moon)step(dt);draw();requestAnimationFrame(loop)}

/* ---------- intro logo animation: a moon leaps from one world to the next, then the title lands ---------- */
function introDraw(g,w,h,p,tt){
  const gr=g.createLinearGradient(0,0,0,h);gr.addColorStop(0,'#0b0a2a');gr.addColorStop(1,'#241450');g.fillStyle=gr;g.fillRect(0,0,w,h);
  for(let i=0;i<70;i++){const x=(i*97.3%1)*w,y=(i*53.7%1)*h;g.globalAlpha=.3+.3*Math.sin(tt*2+i);g.fillStyle='#fff';g.fillRect((i*0.618*w)%w,(i*0.382*h*3.1)%h,1.6,1.6)}g.globalAlpha=1;
