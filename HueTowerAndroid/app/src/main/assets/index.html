<style>/* ===== Golden Mayhem kit: shared screens (intro, home, levels, daily, shop, settings, results, pause, gifts) ===== */
:root{
  --gm-bg:#101030; --gm-panel:#1c1a4a; --gm-panel-2:#14123a; --gm-edge:#3a3590; --gm-ink:#fff; --gm-muted:#a9a6d8;
  --gm-accent:#ffd23f; --gm-accent-ink:#1a1240; --gm-good:#36d48a; --gm-coin:#ffd23f; --gm-scrim:rgba(6,6,24,.82);
  --gm-font-display:system-ui,sans-serif; --gm-font-body:system-ui,sans-serif;
  --gm-safe-t:env(safe-area-inset-top,0px); --gm-safe-b:env(safe-area-inset-bottom,0px);
}
.gm-layer{position:fixed;inset:0;z-index:200;display:grid;place-items:center;padding:calc(12px + var(--gm-safe-t)) max(14px,env(safe-area-inset-right,0px)) calc(12px + var(--gm-safe-b)) max(14px,env(safe-area-inset-left,0px));font-family:var(--gm-font-body);color:var(--gm-ink);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.gm-layer[hidden]{display:none!important}
.gm-scrim{background:var(--gm-scrim)}
.gm-panel{width:min(100%,380px);max-height:100%;overflow:auto;background:var(--gm-panel);border-radius:26px;box-shadow:0 0 0 2px var(--gm-edge),0 24px 50px rgba(0,0,0,.45);padding:20px 18px;display:flex;flex-direction:column;gap:12px;text-align:center;animation:gm-in .22s ease-out;scrollbar-width:none}
.gm-panel::-webkit-scrollbar{display:none}
@keyframes gm-in{from{transform:scale(.92);opacity:0}}
.gm-panel h2{margin:0;font:400 30px/1 var(--gm-font-display);letter-spacing:.01em}
.gm-panel h3{margin:0;font:800 13px/1 var(--gm-font-body);letter-spacing:.14em;color:var(--gm-muted);text-transform:uppercase}
.gm-p{margin:0;color:var(--gm-muted);font-size:15px;line-height:1.35;font-weight:600}
.gm-btn{appearance:none;border:0;border-radius:18px;padding:14px 16px;font:400 22px/1 var(--gm-font-display);background:var(--gm-accent);color:var(--gm-accent-ink);box-shadow:inset 0 -5px 0 rgba(0,0,0,.2);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;touch-action:manipulation}
.gm-btn:active{transform:translateY(2px);box-shadow:inset 0 -2px 0 rgba(0,0,0,.2)}
.gm-btn.sec{background:var(--gm-panel-2);color:var(--gm-ink);box-shadow:inset 0 0 0 2px var(--gm-edge),inset 0 -4px 0 rgba(0,0,0,.25)}
.gm-btn.good{background:var(--gm-good);color:#062a18}
.gm-btn.ghost{background:transparent;color:var(--gm-muted);box-shadow:none;font:800 16px var(--gm-font-body);padding:6px}
.gm-btn.sm{font-size:17px;padding:11px 12px;border-radius:14px}
.gm-btn:disabled{opacity:.45}
.gm-btn:focus-visible,.gm-icon:focus-visible,.gm-tile:focus-visible{outline:3px solid var(--gm-accent);outline-offset:2px}
.gm-ad{font:800 11px var(--gm-font-body);background:rgba(0,0,0,.22);border-radius:6px;padding:3px 5px;letter-spacing:.06em}
.gm-row{display:flex;gap:10px}
.gm-row>*{flex:1}
.gm-coin{color:var(--gm-coin);font-weight:900}
.gm-x{position:absolute;top:10px;right:10px;width:38px;height:38px;border-radius:50%;border:0;background:var(--gm-panel-2);color:var(--gm-ink);font:900 18px var(--gm-font-body);box-shadow:inset 0 0 0 2px var(--gm-edge);cursor:pointer}
.gm-head{position:relative;padding-right:40px;padding-left:40px}

/* ---- intro ---- */
#gm-intro{background:#07060f;padding:0;z-index:400;cursor:pointer}
#gm-intro canvas{width:100%;height:100%;display:block}
#gm-intro .gm-skip{position:absolute;bottom:calc(18px + var(--gm-safe-b));left:0;right:0;text-align:center;font:700 12px var(--gm-font-body);letter-spacing:.2em;color:rgba(255,255,255,.35)}

/* ---- home ---- */
#gm-home{z-index:150;place-items:stretch;padding-top:calc(10px + var(--gm-safe-t))}
#gm-home .gm-home{display:flex;flex-direction:column;height:100%;max-width:440px;width:100%;margin:0 auto;gap:10px}
.gm-top{display:flex;align-items:center;gap:8px}
.gm-pill{display:flex;align-items:center;gap:6px;background:rgba(0,0,0,.35);border-radius:999px;padding:7px 14px 7px 10px;font:900 18px var(--gm-font-body);color:var(--gm-coin);box-shadow:inset 0 0 0 2px rgba(255,255,255,.08);font-variant-numeric:tabular-nums}
.gm-pill .ic{font-size:18px}
.gm-spacer{flex:1}
.gm-icon{position:relative;width:46px;height:46px;border-radius:15px;border:0;background:rgba(0,0,0,.35);box-shadow:inset 0 0 0 2px rgba(255,255,255,.08);color:var(--gm-ink);display:grid;place-items:center;cursor:pointer;padding:0;touch-action:manipulation}
.gm-icon svg{width:24px;height:24px}
.gm-icon .gm-t{position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);font:900 10px var(--gm-font-body);background:var(--gm-panel-2);color:var(--gm-muted);padding:2px 5px;border-radius:6px;white-space:nowrap}
.gm-icon.ready{background:var(--gm-accent);color:var(--gm-accent-ink);animation:gm-wiggle 1.6s infinite}
.gm-icon.ready .gm-t{background:var(--gm-good);color:#062a18}
@keyframes gm-wiggle{0%,80%,100%{transform:rotate(0)}85%{transform:rotate(-10deg)}90%{transform:rotate(10deg)}95%{transform:rotate(-6deg)}}
.gm-dot{position:absolute;top:-3px;right:-3px;width:12px;height:12px;border-radius:50%;background:#ff4d5e;box-shadow:0 0 0 2px var(--gm-bg)}
.gm-title{flex:1;min-height:120px;display:grid;place-items:center;pointer-events:none}
.gm-menu{display:flex;flex-direction:column;gap:10px;padding-bottom:calc(8px + var(--gm-safe-b))}
.gm-play{font-size:34px;padding:18px;border-radius:22px;animation:gm-breathe 2.4s ease-in-out infinite}
@keyframes gm-breathe{50%{transform:scale(1.03)}}
.gm-grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.gm-grid3.four{grid-template-columns:repeat(4,1fr);gap:6px}
.gm-grid3.four .gm-card{font-size:15px;padding:10px 2px 9px}
.gm-card{position:relative;border:0;border-radius:18px;background:var(--gm-panel);box-shadow:inset 0 0 0 2px var(--gm-edge),inset 0 -4px 0 rgba(0,0,0,.25);color:var(--gm-ink);padding:12px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:5px;font:400 18px/1 var(--gm-font-display);cursor:pointer;touch-action:manipulation}

.gm-levels{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}

.gm-tile.next{background:var(--gm-accent);color:var(--gm-accent-ink);box-shadow:inset 0 -4px 0 rgba(0,0,0,.2)}

/* ---- tutorial hand ---- */
#gm-hand{position:fixed;inset:0;z-index:300;pointer-events:none}
#gm-hand[hidden]{display:none}
#gm-hand svg.line{position:absolute;inset:0;width:100%;height:100%}
#gm-hand svg.line path{stroke:var(--gm-accent);stroke-width:4;stroke-dasharray:2 12;stroke-linecap:round;fill:none;animation:gm-dash .6s linear infinite;filter:drop-shadow(0 0 4px rgba(0,0,0,.5))}

#gm-hand .tip{position:absolute;left:50%;transform:translateX(-50%);width:min(88vw,340px);background:var(--gm-panel);color:var(--gm-ink);border-radius:18px;padding:12px 16px;font:800 16px/1.3 var(--gm-font-body);text-align:center;box-shadow:0 0 0 2px var(--gm-accent),0 14px 30px rgba(0,0,0,.4)}

let ac=null,master=null,musicGain=null,sfxGain=null;
function audio(){
  if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)();master=ac.createGain();master.connect(ac.destination);
    musicGain=ac.createGain();musicGain.gain.value=S.set.music?1:0;musicGain.connect(master);sfxGain=ac.createGain();sfxGain.connect(master)}catch(e){}}
  if(ac&&ac.state==='suspended'&&!document.hidden)ac.resume().catch(()=>{});
  return ac;
}
function tone(f1,f2,d,type='sine',v=.07,delay=0){
  if(!S.set.sound||!audio())return;
  try{const t=ac.currentTime+delay,o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f1,t);if(f2&&f2!==f1)o.frequency.exponentialRampToValueAtTime(f2,t+d);
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(sfxGain);o.start(t);o.stop(t+d+.02)}catch(e){}
}
function vibrate(ms){if(!S.set.vibe)return;if(window.GMApp&&GMApp.vibrate){GMApp.vibrate(ms);return}try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}}
const ui={tap:()=>tone(520,620,.06,'triangle',.05),coin:()=>{tone(1100,1500,.09,'sine',.05);tone(1500,1900,.1,'sine',.04,.07)},
  win:()=>[523,659,784,1046].forEach((f,i)=>tone(f,f,.22,'triangle',.06,i*.1)),buy:()=>{tone(700,900,.08,'square',.03);tone(900,1300,.12,'triangle',.05,.06)},
  no:()=>tone(220,160,.18,'sawtooth',.04),open:()=>[392,523,659,784,1046,1318].forEach((f,i)=>tone(f,f*1.01,.18,'triangle',.05,i*.06))};
/* music: soft generative arpeggio over a 4-chord loop */
let mus={on:false,timer:0,step:0,next:0};
function musicStart(){if(!audio()||mus.on)return;mus.on=true;mus.next=ac.currentTime+.1;mus.step=0;musTick()}
function musTick(){
  if(!mus.on)return;const M=C.music||{};const prog=M.prog||[[0,4,7],[-3,0,4],[-7,-3,0],[-5,-1,2]];const root=M.root||220,bpm=M.bpm||92,spb=60/bpm/2;
  while(mus.next<ac.currentTime+.4){
    const bar=Math.floor(mus.step/8)%prog.length,ch=prog[bar],i=mus.step%8,t=mus.next;
    const pat=M.pattern||[0,1,2,1,0,2,1,2];const semi=ch[pat[i]%ch.length]+(i===5?12:0);const f=root*Math.pow(2,semi/12);
    note(f,t,spb*1.8,M.wave||'triangle',.022);
    if(i===0)note(root/2*Math.pow(2,ch[0]/12),t,spb*7,'sine',.035);
    mus.step++;mus.next+=spb;
  }
  mus.timer=setTimeout(musTick,120);
}
function note(f,t,d,type,v){try{const o=ac.createOscillator(),g=ac.createGain(),lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=1800;o.type=type;o.frequency.value=f;
  g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(v,t+.04);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(lp).connect(g).connect(musicGain);o.start(t);o.stop(t+d+.05)}catch(e){}}
function musicStop(){mus.on=false;clearTimeout(mus.timer)}
function applyMusic(){if(!ac)return;musicGain.gain.setTargetAtTime(S.set.music?1:0,ac.currentTime,.1);if(S.set.music)musicStart()}
document.addEventListener('visibilitychange',()=>{if(!ac)return;if(document.hidden){musicStop();ac.suspend().catch(()=>{})}else{ac.resume().catch(()=>{});if(S.set.music)musicStart()}});

function intro(done){
  const first=!S.intro;S.intro=(S.intro||0)+1;save();
  const L=h('div','gm-layer');L.id='gm-intro';L.innerHTML='<canvas></canvas><div class="gm-skip">TAP TO SKIP</div>';document.body.appendChild(L);
  const cv=$('canvas',L),g=cv.getContext('2d');let W,H,dpr;
  function rs(){dpr=Math.min(2,devicePixelRatio||1);W=L.clientWidth;H=L.clientHeight;cv.width=W*dpr;cv.height=H*dpr;g.setTransform(dpr,0,0,dpr,0,0)}rs();addEventListener('resize',rs);
  const studio=first?2.1:0,logo=first?2.3:1.25,total=studio+logo;let t0=performance.now(),end=false;
  function finish(){if(end)return;end=true;removeEventListener('resize',rs);L.style.transition='opacity .35s';L.style.opacity='0';setTimeout(()=>{L.remove();done()},350)}
  L.addEventListener('pointerdown',finish);
  (function fr(now){if(end)return;const t=Math.max(0,(now-t0)/1000);
    g.fillStyle='#07060f';g.fillRect(0,0,W,H);
    if(studio>0&&t<studio){drawStudio(g,W,H,t/studio)}
    else{const p=Math.min(1,(t-studio)/logo);g.save();C.intro.draw(g,W,H,p,t-studio);g.restore();
      const fade=p<.12?1-p/.12:0;if(first&&fade>0){g.fillStyle=`rgba(7,6,15,${fade})`;g.fillRect(0,0,W,H)}}
    if(t>=total){finish();return}requestAnimationFrame(fr)})(t0);
}
function drawStudio(g,W,H,p){
  const a=p<.22?p/.22:p>.8?Math.max(0,1-(p-.8)/.2):1;const cx=W/2,cy=H/2;
  g.globalAlpha=a;
  const rg=g.createRadialGradient(cx,cy,10,cx,cy,Math.max(W,H)*.6);rg.addColorStop(0,'rgba(255,200,60,.16)');rg.addColorStop(1,'rgba(255,200,60,0)');g.fillStyle=rg;g.fillRect(0,0,W,H);
  g.textAlign='center';g.textBaseline='middle';

  g.save();g.translate(cx,cy-fs*1.75);g.scale(fs/52,fs/52);g.fillStyle='#ffc62e';g.beginPath();g.moveTo(-26,10);g.lineTo(-30,-12);g.lineTo(-12,0);g.lineTo(0,-18);g.lineTo(12,0);g.lineTo(30,-12);g.lineTo(26,10);g.closePath();g.fill();g.restore();

  o.textAlign='center';o.textBaseline='middle';o.font='400 '+Math.round(fs)+'px '+dispFont();
  const gr=o.createLinearGradient(0,th/2-fs/2,0,th/2+fs/2);gr.addColorStop(0,'#fff3b0');gr.addColorStop(.5,'#ffc62e');gr.addColorStop(1,'#e88a12');

  g.drawImage(oc,0,cy+4-th/2,tw,th);

    body+=`<button class="gm-tile${open?'':' locked'}${next?' next':''}" data-i="${i}" ${open?'':'aria-disabled="true"'}>${open?i+1:'🔒'}<span class="st">${'<b>★</b>'.repeat(st)}${'★'.repeat(3-st)}</span></button>`}
  body+='</div><p class="gm-p" style="font-size:13px">'+(C.levels.hint||'Earn up to 3 stars on every level. Replay any level to beat your stars.')+'</p>';
  const s=sheet('gm-levelsL','Levels',body);
  s.L.querySelectorAll('.gm-tile').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;if(b.classList.contains('locked')){ui.no();b.classList.remove('gm-shake');void b.offsetWidth;b.classList.add('gm-shake');toast('Finish level '+i+' first');return}ui.tap();startGame(()=>C.levels.play(i))});
  const nx=s.L.querySelector('.gm-tile.next');if(nx)nx.scrollIntoView({block:'center'});
}
function setStars(i,st){const old=S.stars[i]||0;if(st>old){S.stars[i]=st;save()}return Math.max(0,st-old)}

/* ---------- daily challenge ---------- */
function yesterdayKey(){const d=new Date();d.setDate(d.getDate()-1);return dayKey(d)}
function streakNow(){const l=S.daily.last;return(l===dayKey()||l===yesterdayKey())?S.daily.streak:0}
function dailySeed(){return hashStr(C.id+'|'+dayKey())}
function openDaily(){
  const now=new Date(),y=now.getFullYear(),m=now.getMonth(),first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate(),today=now.getDate();
  let cal='<div class="gm-cal">'+['S','M','T','W','T','F','S'].map(d=>`<div class="wd">${d}</div>`).join('');
  for(let i=0;i<first;i++)cal+='<div class="d e"></div>';
  for(let d=1;d<=days;d++){const k=dayKey(new Date(y,m,d));cal+=`<div class="d${S.daily.done[k]?' done':''}${d===today?' today':''}${d>today?' fut':''}">${S.daily.done[k]?'★':d}</div>`}
  cal+='</div>';
  const done=!!S.daily.done[dayKey()],st=streakNow(),rew=dailyReward(done?st:st+1);
  const mid=new Date(y,m,today+1)-now;
  const body=`<h3>${now.toLocaleString('en',{month:'long'})} ${y}</h3>${cal}
   <div class="gm-streak">${I.flame}<span>${st} day streak</span></div>
   <div class="gm-goal">${C.daily.goal}<br>Reward: ${coinTxt(rew)} ${done?'':'<span style="color:var(--gm-muted)">(grows with your streak)</span>'}</div>
   ${done?`<button class="gm-btn sec" disabled>Done ✓ New challenge in <span id="gm-dyt">${fmtTime(mid)}</span></button>`:`<button class="gm-btn" id="gm-dyplay">${I.play.replace('<svg','<svg width="22" height="22"')} Play today's challenge</button>`}`;
  const s=sheet('gm-dailyL','Daily Challenge',body);
  const pb=$('#gm-dyplay',s.L);if(pb)pb.onclick=()=>{ui.tap();startGame(()=>C.daily.play(dailySeed(),dayKey()))};
}
function dailyReward(streak){return 40+10*Math.min(Math.max(streak,1)-1,6)}
/** call when the player beats today's challenge; returns the coin reward (0 if already done today) */
function dailyComplete(key){
  key=key||dayKey();if(S.daily.done[key])return 0;
  S.daily.done[key]=true;S.daily.streak=(S.daily.last===yesterdayKey()?S.daily.streak:0)+1;S.daily.last=key;
  // keep the stored calendar small (about 3 months)
  const keys=Object.keys(S.daily.done).sort();while(keys.length>100)delete S.daily.done[keys.shift()];
  save();return dailyReward(S.daily.streak);
}

/* ---------- shop ---------- */
let shopTab=0;
function openShop(){
  const tabs=[C.shop.skinsTitle||'Skins','Boosters'];

    if(shopTab===0){C.shop.skins.forEach(k=>{const own=k.cost===0||S.owned[k.id],on=(S.equip.skin||C.shop.skins[0].id)===k.id;
      const b=h('button','gm-item'+(on?' on':'')+(!own&&S.coins<k.cost?' poor':''),`<div class="sw" style="${k.swatch||''}">${k.icon||''}</div>${esc(k.name)}<span class="gm-price${own?' own':''}">${on?'Equipped':own?'Tap to use':CUR().icon+' '+k.cost}</span>`);
      b.onclick=()=>{if(own){S.equip.skin=k.id;save();ui.tap();C.shop.onEquip&&C.shop.onEquip(k.id);draw();return}
        if(spend(k.cost)){S.owned[k.id]=true;S.equip.skin=k.id;save();ui.buy();toast(esc(k.name)+' unlocked!');C.shop.onEquip&&C.shop.onEquip(k.id);draw()}else{ui.no();b.classList.remove('gm-shake');void b.offsetWidth;b.classList.add('gm-shake');toast('Not enough '+CUR().name)}};box.appendChild(b)})}
    else{C.shop.boosters.forEach(k=>{const n=S.boost[k.id]||0;
      const b=h('button','gm-item'+(S.coins<k.cost?' poor':''),`<div class="sw" style="background:rgba(255,255,255,.08);font-size:30px">${k.icon}</div>${esc(k.name)} <span style="color:var(--gm-muted)">×${n}</span><span class="ds">${esc(k.desc)}</span><span class="gm-price">${CUR().icon} ${k.cost}</span>`);
      b.onclick=()=>{if(spend(k.cost)){S.boost[k.id]=n+1;save();ui.buy();toast(esc(k.name)+' +1');draw()}else{ui.no();b.classList.remove('gm-shake');void b.offsetWidth;b.classList.add('gm-shake');toast('Not enough '+CUR().name)}};box.appendChild(b)})}
    const fd=S.freeAds.day===dayKey()?S.freeAds.n:0;$('#gm-free',s.L).disabled=fd>=3;$('#gm-freet',s.L).textContent=fd>=3?'Come back tomorrow for more free '+CUR().name:(3-fd)+' free video'+(3-fd>1?'s':'')+' left today';
  };
  s.L.querySelectorAll('.gm-tabs button').forEach(b=>b.onclick=()=>{shopTab=+b.dataset.t;ui.tap();draw()});
  $('#gm-free',s.L).onclick=()=>{rewarded(()=>{if(S.freeAds.day!==dayKey())S.freeAds={day:dayKey(),n:0};S.freeAds.n++;addCoins(20);ui.coin();toast('+'+CUR().icon+' 20');draw()})};
  draw();
}
function equipped(){return S.equip.skin||C.shop.skins[0].id}

function rateAsk(){

/* ---------- results ---------- */
/* opts: {win, title, label, score, best, newBest, stars(0-3|null), coins, extra:{label,amount}, canRevive, reviveLabel, onRevive, onRetry, onNext, onHome} */
function results(o){
  S.runs++;if(S.chest<3)S.chest++;
  if(o.win||o.newBest){S.rate.wins++;if(!S.rate.done&&S.rate.wins>=3&&S.runs>=5&&Date.now()-S.rate.last>3*864e5)S.rate.pending=true}
  let earned=(o.coins||0)+((o.extra&&o.extra.amount)||0);S.coins+=earned;save();
  const starsHtml=o.stars==null?'':`<div class="gm-stars">${I.star}${I.star}${I.star}</div>`;
  const s=sheet('gm-resL',esc(o.title),`${starsHtml}
    ${o.label?`<h3>${esc(o.label)}</h3>`:''}<div class="gm-big">${o.score}</div>${o.newBest?'<span class="gm-newbest">NEW BEST!</span>':(o.best!=null?`<p class="gm-p">Best ${o.best}</p>`:'')}
    <div class="gm-earn" id="gm-earn">+ ${CUR().icon} <span id="gm-earnn">${earned}</span></div>
    ${o.extra?`<p class="gm-p" style="font-size:13px">${esc(o.extra.label)} ${coinTxt(o.extra.amount)} included</p>`:''}
    ${o.canRevive?`<button class="gm-btn good" id="gm-rv">${I.film.replace('<svg','<svg width="22" height="22"')} ${esc(o.reviveLabel||'Keep going')} <span class="gm-ad">AD</span></button>`:''}
    ${earned>0?`<button class="gm-btn sec sm" id="gm-dbl">${I.film.replace('<svg','<svg width="18" height="18"')} Double to ${CUR().icon} ${earned*2} <span class="gm-ad">AD</span></button>`:''}
    ${o.onNext?`<button class="gm-btn" id="gm-nx">Next level ${I.play.replace('<svg','<svg width="20" height="20"')}</button>`:''}
    <div class="gm-row"><button class="gm-btn sec" id="gm-hm" aria-label="Home">${I.home.replace('<svg','<svg width="22" height="22"')}</button><button class="gm-btn ${o.onNext?'sec':''}" id="gm-rt" style="flex:3">${I.retry.replace('<svg','<svg width="20" height="20"')} ${o.retryLabel||'Try again'}</button></div>`,{noClose:true,back:()=>{s.close();maybeInterstitial(()=>{(o.onHome||showHome)()})}});
  if(o.stars!=null){if(o.stars>0)ui.win();setTimeout(()=>s.L.querySelectorAll('.gm-stars svg').forEach((e,i)=>{if(i<o.stars)setTimeout(()=>{e.classList.add('on');tone(700+i*200,900+i*200,.15,'triangle',.06)},i*260)}),250)}
  else if(o.newBest)ui.win();
  const go=fn=>{s.close();maybeInterstitial(fn)};
  const rv=$('#gm-rv',s.L);if(rv)rv.onclick=()=>rewarded(()=>{S.runs--;S.chest=Math.max(0,S.chest-1);S.coins-=earned;save();s.close();o.onRevive()});
  const db=$('#gm-dbl',s.L);if(db)db.onclick=()=>rewarded(()=>{S.coins+=earned;save();ui.coin();db.remove();$('#gm-earnn',s.L).textContent=earned*2;toast('Doubled! +'+CUR().icon+' '+earned)});
  const nx=$('#gm-nx',s.L);if(nx)nx.onclick=()=>{ui.tap();go(()=>{mode='game';o.onNext()})};
  $('#gm-rt',s.L).onclick=()=>{ui.tap();go(()=>{mode='game';o.onRetry()})};
  $('#gm-hm',s.L).onclick=()=>{ui.tap();go(()=>(o.onHome||showHome)())};
}

/* ---------- pause ---------- */
function pause(o){
  const tg=(k,ic)=>`<button class="gm-icon${S.set[k]?'':' off'}" data-k="${k}" aria-label="${k}" style="${S.set[k]?'':'opacity:.4'}">${ic}</button>`;
  const s=sheet('gm-pauseL','Paused',`<div style="display:flex;justify-content:center;gap:10px">${tg('music',I.music)}${tg('sound',I.sound)}${tg('vibe',I.vibe)}</div>

    <button class="gm-btn sec" id="gm-ph">${I.home.replace('<svg','<svg width="20" height="20"')} Home</button>`,{onClose:()=>{if(!left)o.onResume()}});

/* ---------- tutorial hand ---------- */
const HAND_SVG='<svg class="hand" viewBox="0 0 58 70"><path d="M22 4c3.6 0 6 2.4 6 6v20l2-.6c3-.8 5.6.6 6.4 3l.2.6 1.6-.4c3-.6 5.4 1 6 3.4l1.6-.2c3.2-.2 5.6 1.8 5.8 5l.4 10c.2 8-4.2 14.6-11.6 17.2-3 1-6 1.4-9.2 1.4h-3.6c-5.8 0-10.6-3-13.4-8L4.4 46.6c-1.4-2.8-.4-6 2.4-7.2 2.4-1 5-.2 6.4 1.8l2.8 4V10c0-3.6 2.4-6 6-6z" fill="#fff" stroke="#1a1240" stroke-width="3" stroke-linejoin="round"/><path d="M28 30v10M36.6 32.8V41M44 36.6V42" stroke="#1a1240" stroke-width="2.6" stroke-linecap="round"/></svg>';
let handEl=null,handAnim=null;
function hand(o){
  if(!handEl){handEl=h('div');handEl.id='gm-hand';document.body.appendChild(handEl)}
  handEl.hidden=false;if(handAnim){handAnim.cancel();handAnim=null}
  let html='';
  if(o.mode==='drag'||o.line){html+=`<svg class="line"><path d="M${o.x} ${o.y} L${o.x2} ${o.y2}"/></svg>`}
  if(o.mode==='tap')html+=`<div class="ring" style="left:${o.x}px;top:${o.y}px"></div>`;
  if(o.x!=null)html+=HAND_SVG;
  if(o.text){const below=o.tipAt==='bottom'||(o.tipAt!=='top'&&(o.y||0)<innerHeight*.45);html+=`<div class="tip" style="${below?'bottom:calc(24px + var(--gm-safe-b))':'top:calc(70px + var(--gm-safe-t))'}">${o.text}</div>`}
  handEl.innerHTML=html;
  const hd=$('.hand',handEl);if(!hd)return;
  if(o.mode==='drag'){hd.style.transform=`translate(${o.x}px,${o.y}px)`;handAnim=hd.animate([{transform:`translate(${o.x}px,${o.y}px)`,offset:0},{transform:`translate(${o.x}px,${o.y}px) scale(.9)`,offset:.15},{transform:`translate(${o.x2}px,${o.y2}px) scale(.9)`,offset:.75},{transform:`translate(${o.x2}px,${o.y2}px)`,offset:.85,opacity:1},{transform:`translate(${o.x2}px,${o.y2}px)`,offset:1,opacity:0}],{duration:1700,iterations:Infinity,easing:'ease-in-out'})}
  else{hd.style.setProperty('--hx',o.x+'px');hd.style.setProperty('--hy',o.y+'px');hd.classList.add('tap')}
}
function handHide(){if(handEl)handEl.hidden=true;if(handAnim){handAnim.cancel();handAnim=null}}

/* ---------- Android back button ---------- */
window.__back=function(){
  if($('#gm-intro'))return'ok';
  if($('#gm-adph'))return'ok';
  if(stack.length){stack[stack.length-1].back();return'ok'}
  if(mode==='game'){C.onBack&&C.onBack();return'ok'}
  return'home';
};

/* ---------- boot ---------- */
function init(cfg){

}
function tutorialDone(){S.tut=true;save()}

window.GM={init,showHome,startGame,results,pause,toast,hand,handHide,rewarded,interstitial,tone,vibrate,ui,audio,
  coins,addCoins,spend,equipped,takeBoosters,setStars,stars:i=>S.stars[i]||0,dailyComplete,dailySeed,dayKey,tutorialDone,
  get store(){return S.game},save,best:(k,v)=>{if(v!=null&&v>(S.best[k]||0)){S.best[k]=v;save();return true}return v!=null?false:(S.best[k]||0)},
  get mode(){return mode},set mode(v){mode=v},openSettings,icons:I,hashStr,sheet,refreshHome};
})();

<script>
(()=>{

/* ---------- seeded random so levels and the Daily Challenge are the same for everyone ---------- */
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let rng=Math.random;

/* ---------- themes (shop skins) ---------- */
const THEMES=[
  {id:'rainbow',name:'Rainbow',cost:0,col:(i,h0)=>[(h0+i*7)%360,72,60]},
  {id:'candy',name:'Candy',cost:120,col:i=>[[330,180,35,265,140][i%5],85,76]},

const LEVELS=30;
function levelCfg(i){const target=10+i*2;return{mode:'level',level:i,target,speedAt:i*3,seed:5303*(i+1)+11,p2:Math.round(target*.3),p3:Math.round(target*.55)}}

/* ---------- missions (kept between games) ---------- */
const MT={
  score:{targets:[10,20,35,50,75],reward:t=>t,text:t=>`Reach ${t} in one game`,perGame:true},
  perfects:{targets:[3,6,10,15,20],reward:t=>t*3,text:t=>`Land ${t} perfects in one game`,perGame:true},
  combo:{targets:[3,4,6,8,10],reward:t=>t*5,text:t=>`Get a ${t}× perfect streak`,perGame:true},
  coinsGame:{targets:[15,30,50,80,120],reward:t=>Math.round(t*.6),text:t=>`Earn ${t} coins in one game`,perGame:true},
  fevers:{targets:[1,1,2,2,3],reward:t=>t*20,text:t=>t>1?`Start ${t} Fevers in one game`:'Start a Fever',perGame:true},
  games:{targets:[3,5,8,10,15],reward:t=>t*4,text:t=>`Play ${t} games`,stat:'games'},
  blocks:{targets:[60,150,300,500,800],reward:t=>Math.round(t/6),text:t=>`Stack ${t} blocks in total`,stat:'blocks'},
  powers:{targets:[2,4,6,10,15],reward:t=>t*5,text:t=>`Grab ${t} power-ups`,stat:'powers'}};
let M;// mission state lives in the kit's save: GM.store
function mInit(){M=GM.store;if(!M.missions){M.missions=[];M.done=0;M.stats={games:0,blocks:0,powers:0}}refillMissions()}
function mLevel(){return Math.floor(M.done/3)+1}
function newMission(exclude){
  const types=Object.keys(MT).filter(k=>!exclude.includes(k));
  const type=types[Math.floor(Math.random()*types.length)],def=MT[type];
  const t=def.targets[Math.min(4,mLevel()-1)];
  return{type,target:t,reward:def.reward(t),progress:0,base:def.stat?M.stats[def.stat]:0,done:false};
}
function refillMissions(){M.missions=M.missions.filter(m=>!m.done&&MT[m.type]);while(M.missions.length<3)M.missions.push(newMission(M.missions.map(m=>m.type)));GM.save()}
function missionHtml(){return M.missions.map(m=>{const p=Math.min(m.target,m.progress);return`<li class="mission${m.done?' done':''}"><span class="t">${m.done?'✓ ':''}${MT[m.type].text(m.target)}</span><span class="r"><span class="coin"></span>${m.reward}</span><span class="bar"><i style="width:${p/m.target*100}%"></i></span><span class="p">${m.done?'Complete':p+' / '+m.target}</span></li>`}).join('')}
function openMissions(){
  refillMissions();
  GM.sheet('missionsL','Missions',`<div class="lvlpill">MISSION LEVEL ${mLevel()}</div><p class="gm-p">Finish missions for coins. Every 3 you finish raises your mission level.</p><ul class="missions">${missionHtml()}</ul>
    <ul class="help"><li><b>FEVER</b>5 perfects in a row: 2× coins and easier perfects for 8 blocks.</li><li><b>WIDE</b>Grows your tower back to full width.</li><li><b>SLOW</b>Slows the next 5 blocks.</li><li><b>×5</b>Gold block worth 5 coins.</li></ul>`);
}
function checkMissions(final){
  if(cfg.tut)return;
  for(const m of M.missions){
    if(m.done)continue;const def=MT[m.type];
    if(def.perGame){const v={score:run.score,perfects:run.perfects,combo:run.combo,coinsGame:run.coins,fevers:run.fevers}[m.type];m.progress=Math.max(m.progress,v)}
    else m.progress=M.stats[def.stat]-m.base;
    if(m.progress>=m.target){m.done=true;M.done++;GM.addCoins(m.reward);if(!final)toast(`Mission done! +${m.reward}`,'good');beep(784,.12);setTimeout(()=>beep(1046,.2),120)}
  }
  GM.save();
}

/* ---------- game state ---------- */
let state='attract',cfg=endlessCfg(),stack=[],cur=null,falling=[],sparks=[],rings=[],cam=0,score=0,combo=0,hue0=0;
let run=null,slowLeft=0,lastPower=0,fever=0,shake=0,flash=null,bestCrossed=false,startBest=0,boosts={},netUsed=false,tutDrops=0,tutKey='';
const stars=Array.from({length:80},()=>({x:Math.random(),y:Math.random(),r:Math.random()*1.4+.3,t:Math.random()*6}));
function layerY(i){return baseY-i*blockH}

function reset(c){
  cfg=c;rng=c.seed!=null?mulberry(c.seed):Math.random;
  hue0=Math.floor(rng()*360);
  const bw=boosts.wide?Math.min(W*.8,baseW*1.3):baseW;
  stack=[{x:(W-bw)/2,w:bw,i:0}];
  falling=[];sparks=[];rings=[];score=0;combo=0;cam=0;slowLeft=boosts.slow?8:0;lastPower=0;fever=0;shake=0;flash=null;netUsed=false;
  zoneIdx=0;zoneFrom=ZONES[0];zoneFade=1;bestCrossed=false;startBest=cfg.mode==='endless'?GM.best('endless'):0;tutDrops=0;tutKey='';
  run={score:0,perfects:0,combo:0,coins:0,fevers:0,revived:false};
  spawn();
}
function spawn(fromSide){
  const prev=stack[stack.length-1],i=stack.length;
  const fromLeft=fromSide!==undefined?fromSide:i%2===0;
  let speed=Math.min(150+(score+cfg.speedAt)*6,520)*(W/400)**.5;
  if(cfg.tut)speed*=.5;
  if(slowLeft>0){speed*=.5;slowLeft--}
  let power=null;
  if(!cfg.tut&&state!=='attract'&&score>=5&&score-lastPower>=5&&rng()<.18){
    power=prev.w/baseW<.55&&rng()<.6?'wide':['wide','slow','gold'][Math.floor(rng()*3)];lastPower=score;

}
function start(c){
  boosts={};if(!c.tut)GM.takeBoosters().forEach(id=>boosts[id]=true);
  state='play';reset(c);theme=THEMES.find(t=>t.id===GM.equipped())||THEMES[0];
  showHud(true);$('score').textContent='0';paintNext();paintFever();paintCoins();
  const on=Object.keys(boosts).map(id=>BOOSTERS.find(b=>b.id===id).icon).join(' ');if(on)GM.toast('Boosters on: '+on);
}
function earn(n){if(fever>0)n*=2;run.coins+=n;bumpCoins()}

/* attract mode on the home screen: a ghost tower that builds itself */
function toAttract(){state='attract';showHud(false);GM.handHide();boosts={};reset({mode:'endless',speedAt:6,seed:null});theme=THEMES.find(t=>t.id===GM.equipped())||THEMES[0]}
function attractStep(){const prev=stack[stack.length-1];if(Math.abs(cur.x-prev.x)<cur.speed/60){stack.push({x:prev.x,w:prev.w,i:cur.i});score++;if(stack.length>28){stack=stack.slice(-1);stack[0].i=0;score=0;cam=0}spawn()}}

function gameOver(){
  state='dead';fever=0;paintFever();
  if(cfg.tut){return}
  M.stats.games++;checkMissions(true);
  const nb=cfg.mode==='endless'&&GM.best('endless',score);
  setTimeout(()=>{
    const base={title:'Toppled!',coins:run.coins,canRevive:!run.revived&&score>=3,reviveLabel:'Save your tower',onRevive:revive,onHome:goHome};
    if(cfg.mode==='endless')GM.results({...base,label:'Height',score,newBest:nb&&score>0,best:GM.best('endless'),onRetry:()=>start(endlessCfg())});
    else if(cfg.mode==='level')GM.results({...base,label:'Level '+(cfg.level+1)+' · goal '+cfg.target,score:score+'/'+cfg.target,retryLabel:'Retry level',onRetry:()=>start(levelCfg(cfg.level))});
    else GM.results({...base,label:'Daily Challenge · goal '+cfg.target,score:score+'/'+cfg.target,onRetry:()=>start(dailyCfg(cfg.seed,cfg.key))});

}
function revive(){run.revived=true;state='play';showHud(true);slowLeft=3;combo=0;spawn(Math.random()<.5);toast('Back in it!','good');beep(523,.1);setTimeout(()=>beep(784,.15),100)}
function win(){
  state='win';cur=null;shake=6;GM.vibrate(60);
  const top=stack[stack.length-1];for(let k=0;k<4;k++)setTimeout(()=>burst(top.x-40,layerY(stack.length-1),top.w+80,(k*90)%360,30,70),k*150);
  toast('GOAL!','good');beep(659,.1);setTimeout(()=>beep(880,.1),90);setTimeout(()=>beep(1319,.25),180);
  M.stats.games++;checkMissions(true);
  setTimeout(()=>{
    if(cfg.mode==='level'){
      const st=1+(run.perfects>=cfg.p2?1:0)+(run.perfects>=cfg.p3?1:0);const ns=GM.setStars(cfg.level,st);
      GM.results({win:true,title:'Level '+(cfg.level+1)+' complete!',label:'Perfects (★★ '+cfg.p2+' · ★★★ '+cfg.p3+')',score:run.perfects,stars:st,coins:run.coins,
        extra:ns?{label:'New star bonus',amount:ns*10}:null,retryLabel:'Replay',onRetry:()=>start(levelCfg(cfg.level)),onNext:cfg.level<LEVELS-1?()=>start(levelCfg(cfg.level+1)):null,onHome:goHome});
    }else{const rew=GM.dailyComplete(cfg.key);
      GM.results({win:true,title:'Daily Challenge done!',label:'Height',score,coins:run.coins,extra:rew?{label:'Daily reward',amount:rew}:null,retryLabel:'Play again',onRetry:()=>start(dailyCfg(cfg.seed,cfg.key)),onHome:goHome})}

}
function goHome(){toAttract();GM.showHome()}
function openPause(){if(state!=='play')return;state='paused';GM.handHide();tutKey='';
  GM.pause({onResume:()=>{state='play'},onRestart:()=>cfg.tut?tutorial():start(cfg.mode==='level'?levelCfg(cfg.level):cfg.mode==='daily'?dailyCfg(cfg.seed,cfg.key):endlessCfg()),onHome:goHome})}

function burst(x,y,w,h,n,light){if(reduced)return;for(let k=0;k<n;k++)sparks.push({x:x+Math.random()*w,y,vx:(Math.random()-.5)*200,vy:-Math.random()*200-40,life:1,h,l:light})}
function drop(){
  const prev=stack[stack.length-1],y=layerY(stack.length);
  const L=Math.max(cur.x,prev.x),R=Math.min(cur.x+cur.w,prev.x+prev.w),ov=R-L;
  if(ov<=0){
    falling.push({x:cur.x,y,w:cur.w,vy:0,vx:cur.dir*40,rot:0,vr:cur.dir*1.5,i:cur.i});
    shake=reduced?0:10;buzz(80);
    if(cfg.tut){GM.toast('Missed! Tap when it\'s right above the tower');spawn();return}
    if(boosts.save&&!netUsed){netUsed=true;toast('🪂 Safety net!','good');slowLeft=2;spawn();return}
    cur=null;gameOver();return;
  }
  const [hh]=theme.col(cur.i,hue0);
  const tol=Math.max(3,W*.008)*(fever>0?2.5:1)*(cfg.tut?2:1);
  let nx=L,nw=ov,perfect=false;
  if(Math.abs(cur.x-prev.x)<tol){
    perfect=true;nx=prev.x;nw=prev.w;combo++;run.perfects++;run.combo=Math.max(run.combo,combo);
    if(combo>=3){nw=Math.min(prev.w+10,baseW);nx=prev.x-(nw-prev.w)/2}
    earn(combo>=3?2:1);
    burst(nx,y,nw,hh,16,75);rings.push({x:nx+nw/2,y:y+blockH/2,w:nw,life:1});
    beep(440*Math.pow(2,Math.min(combo,14)/12),.12,'triangle');buzz(15);
    if(combo===5&&fever<=0){fever=9;run.fevers++;toast('FEVER! 2× coins','hot');beep(880,.1,'square',.06);setTimeout(()=>beep(1175,.15,'square',.06),90)}

    shake=reduced?0:4;
  }else{
    combo=0;if(score%2)earn(1);
    const left=cur.x<prev.x,cutX=left?cur.x:R,cutW=cur.w-ov;
    falling.push({x:cutX,y,w:cutW,vy:0,vx:(left?-1:1)*60,rot:0,vr:(left?-1:1)*2.2,i:cur.i});
    beep(300+score*4,.07,'square',.06);buzz(8);shake=reduced?0:2;
  }
  if(cur.power){
    M.stats.powers++;
    if(cur.power==='wide'){const c=nx+nw/2;nw=baseW;nx=Math.max(4,Math.min(W-nw-4,c-nw/2));toast('Wide!','good')}
    if(cur.power==='slow'){slowLeft=5;toast('Slow-mo for 5 blocks','good')}
    if(cur.power==='gold'){earn(5);toast(fever>0?'+10 coins':'+5 coins','good');burst(nx,y,nw,45,26,65)}
    beep(880,.1,'sine',.1);
  }
  stack.push({x:nx,w:nw,i:cur.i});flash={i:stack.length-1,life:1,perfect};
  if(fever>0){fever--;if(fever===0)toast('Fever over')}
  score++;run.score=score;if(!cfg.tut)M.stats.blocks++;popScore();
  if(cfg.tut){tutDrops++;tutKey='';if(tutDrops>=6){tutorialDone();return}}

  paintNext();paintFever();checkMissions(false);

  spawn();
}

/* ---------- tutorial: wait until the block is right above the tower, then tap ---------- */
function tutorial(){start({mode:'level',level:0,speedAt:0,seed:99,tut:true})}
function tutorialTick(){
  if(!cur)return;const prev=stack[stack.length-1];const aligned=Math.abs(cur.x-prev.x)<prev.w*.15;
  const k=(aligned?'tap':'wait')+tutDrops;if(k===tutKey)return;tutKey=k;
  if(aligned)GM.hand({x:W/2,y:H*.86,mode:'tap',text:'<b>TAP now!</b>',tipAt:'top'});
  else GM.hand({text:['The block slides back and forth. <b>Tap</b> when it is right above the tower.','Overhangs get <b>sliced off</b>, so line it up!','Land <b>perfects</b> in a row to grow the tower back and start a <b>Fever</b>.','Great! A few more…'][Math.min(tutDrops,3)],tipAt:'top'});
}
function tutorialDone(){
  state='win';cur=null;GM.handHide();GM.tutorialDone();burst(0,layerY(stack.length-1),W,60,40,70);beep(659,.1);setTimeout(()=>beep(988,.2),100);
  setTimeout(()=>GM.results({title:"You're ready!",label:'Tutorial complete',score:'★',coins:20,retryLabel:'Play Level 1',onRetry:()=>start(levelCfg(0)),onHome:goHome}),900);
}

/* ---------- input ---------- */
function tap(){if(state==='play'&&cur)drop()}
cv.addEventListener('pointerdown',e=>{e.preventDefault();tap()});
addEventListener('keydown',e=>{if(e.code==='Space'&&state==='play'){e.preventDefault();tap()}else if(e.key==='Escape')openPause()});
$('pauseBtn').addEventListener('click',openPause);

/* ---------- drawing ---------- */
function lerp(a,b,t){return a+(b-a)*t}
function mix(c1,c2,t){return c1.map((v,k)=>Math.round(lerp(v,c2[k],t)))}
function currentBg(){const z=ZONES[zoneIdx];return{top:mix(zoneFrom.top,z.top,zoneFade),bot:mix(zoneFrom.bot,z.bot,zoneFade),stars:lerp(zoneFrom.stars,z.stars,zoneFade)}}
function block(x,y,w,i,a=1,power=null,t=0){
  const [h,s,l]=theme.col(i,hue0);ctx.globalAlpha=a;
  if(power){const glow=.35+.25*Math.sin(t*8);ctx.fillStyle=power==='gold'?`rgba(255,209,102,${glow})`:`rgba(255,255,255,${glow})`;ctx.fillRect(x-5,y-5,w+10,blockH+10)}
  const edge=Math.max(3,blockH*.17);
  if(theme.neon){ctx.fillStyle=`hsla(${h},${s}%,${l}%,.25)`;ctx.fillRect(x-2,y-2,w+4,blockH+4);ctx.fillStyle='#120d26';ctx.fillRect(x+1,y+1,w-2,blockH-2);ctx.strokeStyle=`hsl(${h} ${s}% ${l}%)`;ctx.lineWidth=2;ctx.strokeRect(x+1,y+1,w-2,blockH-2)}
  else{ctx.fillStyle=power==='gold'?'hsl(44 92% 55%)':`hsl(${h} ${s}% ${l}%)`;ctx.fillRect(x,y,w,blockH);
    ctx.fillStyle=power==='gold'?'hsl(48 100% 78%)':`hsl(${h} ${Math.min(100,s+10)}% ${Math.min(92,l+14)}%)`;ctx.fillRect(x,y,w,edge);
    ctx.fillStyle=power==='gold'?'hsl(38 80% 38%)':`hsl(${h} ${s-10}% ${Math.max(15,l-18)}%)`;ctx.fillRect(x,y+blockH-edge,w,edge)}
  if(power){ctx.fillStyle=theme.neon?'#fff':'rgba(20,14,40,.85)';ctx.font=`${Math.round(blockH*.62)}px ${FONT}`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText({wide:'WIDE',slow:'SLOW',gold:'×5'}[power],x+w/2,y+blockH/2+1)}
  ctx.globalAlpha=1;
}
function flagLine(n,label,col){const by=layerY(n)+blockH;if(by+cam<-20||by+cam>H+20)return;ctx.strokeStyle=col;ctx.lineWidth=2;ctx.setLineDash([8,7]);ctx.beginPath();ctx.moveTo(0,by);ctx.lineTo(W,by);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle=col;ctx.font=`15px ${FONT}`;ctx.textAlign='right';ctx.textBaseline='bottom';ctx.fillText(label,W-14,by-4)}

let last=performance.now(),tt=0;
function frame(now){
  const dt=Math.min((now-last)/1000,.05);last=now;tt+=dt;
  if((state==='play'||state==='attract')&&cur){
    cur.x+=cur.dir*cur.speed*dt;const minX=-cur.w*.6,maxX=W-cur.w*.4;
    if(cur.x>maxX){cur.x=maxX;cur.dir=-1}if(cur.x<minX){cur.x=minX;cur.dir=1}
    if(state==='attract')attractStep();else if(cfg.tut)tutorialTick();
  }
  const topY=layerY(stack.length);const want=Math.max(0,H*.45-topY);
  cam+=(want-cam)*Math.min(1,dt*(state==='dead'?2:6));
  if(zoneFade<1)zoneFade=Math.min(1,zoneFade+dt*.6);
  shake*=Math.pow(.0005,dt);const sx=shake>.3?(Math.random()-.5)*shake:0,sy=shake>.3?(Math.random()-.5)*shake:0;
  const bg=currentBg();const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,`rgb(${bg.top})`);g.addColorStop(1,`rgb(${bg.bot})`);ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  if(fever>0&&state==='play'){ctx.fillStyle=`rgba(255,95,162,${.08+.06*Math.sin(tt*10)})`;ctx.fillRect(0,0,W,H)}
  if(zoneIdx>=2&&!reduced){const a=zoneIdx===2?.18*zoneFade:.08;for(let r=0;r<2;r++){ctx.beginPath();ctx.moveTo(0,H*(.18+r*.12));for(let x=0;x<=W;x+=20)ctx.lineTo(x,H*(.18+r*.12)+Math.sin(x/90+tt*.6+r*2)*22);ctx.lineTo(W,0);ctx.lineTo(0,0);ctx.closePath();ctx.fillStyle=r?`rgba(124,196,255,${a})`:`rgba(110,231,183,${a})`;ctx.fill()}}
  for(const s of stars){const tw=reduced?.6:.5+.5*Math.sin(tt*1.5+s.t);ctx.globalAlpha=tw*bg.stars;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(s.x*W,((s.y*H+cam*.15)%H),s.r,0,7);ctx.fill()}
  ctx.globalAlpha=1;
  ctx.save();ctx.translate(sx,cam+sy);
  ctx.fillStyle='rgba(0,0,0,.28)';ctx.fillRect(0,baseY+blockH,W,H+cam);
  if(state!=='attract'){
    if(cfg.target)flagLine(cfg.target,'GOAL '+cfg.target,'rgba(110,231,183,.95)');
    else if(startBest>0&&!bestCrossed)flagLine(startBest+1,'BEST '+startBest,'rgba(255,209,102,.9)');
  }
  const dim=state==='attract'?.45:1;
  const firstVis=Math.max(0,Math.floor((baseY+cam-H)/blockH)-1);
  for(let i=firstVis;i<stack.length;i++){const b=stack[i];block(b.x,layerY(i),b.w,b.i,dim)}
  if(flash&&flash.life>0){const b=stack[flash.i];if(b){ctx.globalAlpha=flash.life*(flash.perfect?.75:.4);ctx.fillStyle='#fff';ctx.fillRect(b.x,layerY(flash.i),b.w,blockH);ctx.globalAlpha=1}flash.life-=dt*4}
  if(cur&&(state==='play'||state==='paused'||state==='attract')){const prev=stack[stack.length-1];
    if(state!=='attract'){ctx.fillStyle='rgba(255,255,255,.07)';ctx.fillRect(prev.x,layerY(stack.length),prev.w,blockH)}
    block(cur.x,layerY(stack.length),cur.w,cur.i,dim,cur.power,tt)}
  for(let k=rings.length-1;k>=0;k--){const r=rings[k];r.life-=dt*2.2;if(r.life<=0){rings.splice(k,1);continue}const grow=(1-r.life)*30;ctx.globalAlpha=r.life;ctx.strokeStyle=fever>0?'#ff5fa2':'#fff';ctx.lineWidth=3;ctx.strokeRect(r.x-r.w/2-grow,r.y-blockH/2-grow*.6,r.w+grow*2,blockH+grow*1.2)}
  ctx.globalAlpha=1;
  for(let k=falling.length-1;k>=0;k--){const f=falling[k];f.vy+=1400*dt;f.y+=f.vy*dt;f.x+=f.vx*dt;f.rot+=f.vr*dt;ctx.save();ctx.translate(f.x+f.w/2,f.y+blockH/2);ctx.rotate(f.rot);block(-f.w/2,-blockH/2,f.w,f.i,.9);ctx.restore();if(f.y+cam>H+200)falling.splice(k,1)}
  for(let k=sparks.length-1;k>=0;k--){const s=sparks[k];s.vy+=500*dt;s.x+=s.vx*dt;s.y+=s.vy*dt;s.life-=dt*1.6;if(s.life<=0){sparks.splice(k,1);continue}ctx.globalAlpha=s.life;ctx.fillStyle=`hsl(${s.h} 90% ${s.l}%)`;ctx.fillRect(s.x,s.y,4,4)}
  ctx.globalAlpha=1;ctx.restore();
  if(slowLeft>0&&state==='play'){ctx.fillStyle='rgba(124,196,255,.10)';ctx.fillRect(0,0,W,H)}
  requestAnimationFrame(frame);
}

/* ---------- intro logo animation: rainbow blocks drop and stack, then the title appears ---------- */
function introDraw(g,w,h,p,t){
  const gr=g.createLinearGradient(0,0,0,h);gr.addColorStop(0,'#1d1240');gr.addColorStop(1,'#5b2a5e');g.fillStyle=gr;g.fillRect(0,0,w,h);
  const bh=Math.min(h/22,34),bw=Math.min(w*.5,220),n=7,base=h*.62;
  for(let i=0;i<n;i++){const appear=Math.min(1,Math.max(0,(p-i*.06)/.08));if(appear<=0)continue;
    const yy=base-i*bh-(1-appear*appear)*h*.5;const ww=bw*(1-i*.06);const x=w/2-ww/2+(i%2?1:-1)*(1-appear)*w*.3;
    const hue=(330+i*40)%360;g.globalAlpha=appear;g.fillStyle=`hsl(${hue} 72% 60%)`;g.fillRect(x,yy,ww,bh);g.fillStyle=`hsl(${hue} 82% 74%)`;g.fillRect(x,yy,ww,bh*.18);g.fillStyle=`hsl(${hue} 62% 42%)`;g.fillRect(x,yy+bh*.82,ww,bh*.18)}
  g.globalAlpha=1;
  const tp=Math.min(1,Math.max(0,(p-.5)/.25));
  if(tp>0){g.save();g.globalAlpha=tp;g.translate(w/2,h*.8);const sc=.7+.3*(1-Math.pow(1-tp,3));g.scale(sc,sc);g.textAlign='center';g.textBaseline='middle';
    g.font='400 '+Math.round(Math.min(w*.16,80))+'px "Lilita One",sans-serif';const tw=g.measureText('Hue Tower').width;const lg=g.createLinearGradient(-tw/2,0,tw/2,0);
    ['#ff7aa2','#ffd166','#6ee7b7','#7cc4ff','#b69cff'].forEach((c,i)=>lg.addColorStop(i/4,c));g.fillStyle='rgba(0,0,0,.35)';g.fillText('Hue Tower',0,5);g.fillStyle=lg;g.fillText('Hue Tower',0,0);
    g.font='400 '+Math.round(Math.min(w*.055,26))+'px "Lilita One",sans-serif';g.fillStyle='#fff';g.fillText('C O L O R   B L O C K   S T A C K',0,Math.min(w*.16,80)*.72);g.restore()}
  if(p>.9){g.fillStyle='rgba(7,6,15,'+((p-.9)/.1)+')';g.fillRect(0,0,w,h)}
}
