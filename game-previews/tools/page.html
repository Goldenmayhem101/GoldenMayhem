<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=540"><style>
html,body{margin:0;background:#111;overflow:hidden}
#wrap{position:relative;width:540px;height:960px;overflow:hidden;font-family:'Arial Black',Impact,system-ui,sans-serif}
#c,#c canvas{position:absolute;inset:0;width:540px;height:960px}
#hud{position:absolute;inset:0;pointer-events:none;color:#fff}
.stroke{-webkit-text-stroke:5px #170F45;paint-order:stroke fill;text-shadow:0 4px 0 #170F45}
.logo{position:absolute;top:14px;left:0;right:0;text-align:center;font-size:38px;letter-spacing:1px;line-height:1}
.logo small{display:block;font-size:13px;letter-spacing:5px;color:#ffd84a;-webkit-text-stroke:3px #170F45;margin-bottom:4px}
.pill{position:absolute;background:rgba(23,15,69,.82);border:3px solid #ffd84a;border-radius:22px;padding:6px 16px;font-size:20px;color:#fff}
.tag{position:absolute;left:0;right:0;bottom:0;padding:44px 20px 26px;text-align:center;font-size:27px;line-height:1.05;background:linear-gradient(transparent,rgba(23,15,69,.92) 55%)}
.tag em{font-style:normal;color:#ffd84a}
.btn{position:absolute;border-radius:50%;border:5px solid #170F45;display:flex;align-items:center;justify-content:center;font-size:20px;box-shadow:0 5px 0 #170F45}
.bar{position:absolute;height:22px;border:4px solid #170F45;border-radius:14px;background:#2a2060;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(#ffe36a,#ff9a1f)}
.pop{position:absolute;font-size:34px;color:#ffd84a;transform:rotate(-6deg)}
</style></head><body><div id="wrap"><div id="c"></div><div id="hud"></div></div>
